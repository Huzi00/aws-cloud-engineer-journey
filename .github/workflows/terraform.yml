name: "Terraform CI Validation & Planning"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  terraform-ci:
    name: "Terraform Validate & Plan"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./module-14-terraform-modules

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Verify Terraform Formatting
        run: terraform fmt -check -recursive

      - name: Initialize Local Modules & Backend
        run: terraform init -backend=false

      - name: Validate Terraform Configuration
        run: terraform validate

      - name: Terraform Plan (Dev Workspace)
        run: |
          terraform workspace select dev || terraform workspace new dev
          terraform plan -backend=false -no-color

      - name: Terraform Plan (Prod Workspace)
        run: |
          terraform workspace select prod || terraform workspace new prod
          terraform plan -backend=false -no-color