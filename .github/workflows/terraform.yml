name: "Terraform CI Validation & Security Scan"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  terraform-ci:
    name: "Format, Validate & Security Scan"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./module-14-terraform-modules

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Verify Terraform Formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform (Local Backend for CI)
        run: terraform init -backend=false

      - name: Validate Terraform Configuration
        run: terraform validate

      - name: Run TFLint Linter
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
          tflint --init
          tflint