name: "Terraform CI Validation & Planning"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  terraform-ci:
    name: "Terraform Validate & Plan"
    runs-on: ubuntu-latest

    concurrency:
      group: terraform-ci-${{ github.ref }}
      cancel-in-progress: true

    defaults:
      run:
        working-directory: ./module-14-terraform-modules

    env:
      AWS_ACCESS_KEY_ID: "mock_access_key"
      AWS_SECRET_ACCESS_KEY: "mock_secret_key"
      AWS_DEFAULT_REGION: "af-south-1"
      TF_VAR_ci_ami_override: "ami-12345678"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Verify Terraform Formatting
        run: terraform fmt -check -recursive

      - name: Initialize Local Modules
        run: terraform init -backend=false

      - name: Validate Terraform Configuration
        run: terraform validate

     - name: Terraform Plan (Dev Workspace)
        id: plan_dev
        run: |
          terraform workspace select -or-create dev
          terraform plan -input=false -refresh=false -no-color | tee plan_dev.log

      - name: Terraform Plan (Prod Workspace)
        id: plan_prod
        run: |
          terraform workspace select -or-create prod
          terraform plan -input=false -refresh=false -no-color | tee plan_prod.log

      - name: Write Workspace Plan Summary
        if: always()
        run: |
          DEV_PLAN=$(grep -E '^Plan:' plan_dev.log 2>/dev/null || echo "N/A (check logs)")
          PROD_PLAN=$(grep -E '^Plan:' plan_prod.log 2>/dev/null || echo "N/A (check logs)")
          {
            echo "## Terraform Plan Summary (\`${{ github.sha }}\`)"
            echo ""
            echo "| Workspace | Status | Plan Summary |"
            echo "| --- | --- | --- |"
            echo "| \`dev\` | \${{ steps.plan_dev.outcome }} | ${DEV_PLAN} |"
            echo "| \`prod\` | \${{ steps.plan_prod.outcome }} | ${PROD_PLAN} |"
          } >> "$GITHUB_STEP_SUMMARY"