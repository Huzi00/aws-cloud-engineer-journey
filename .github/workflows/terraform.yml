name: "Terraform CI Validation & Planning"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  terraform-ci:
    name: "Terraform Validate & Plan"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./module-14-terraform-modules

    env:
      AWS_ACCESS_KEY_ID: "mock_access_key"
      AWS_SECRET_ACCESS_KEY: "mock_secret_key"
      AWS_DEFAULT_REGION: "af-south-1"
      TF_VAR_ci_ami_override: "ami-12345678"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Verify Terraform Formatting
        run: terraform fmt -check -recursive

      - name: Initialize Local Modules
        run: terraform init -backend=false

      - name: Validate Terraform Configuration
        run: terraform validate

      - name: Terraform Plan (Dev Workspace)
        run: |
          terraform workspace select dev 2>/dev/null || terraform workspace new dev
          terraform plan -input=false -refresh=false -no-color

      - name: Terraform Plan (Prod Workspace)
        run: |
          terraform workspace select prod 2>/dev/null || terraform workspace new prod
          terraform plan -input=false -refresh=false -no-color